on: [workflow_dispatch]
name: Deploy Initial Infrastructure

jobs:
  deploy-container-apps:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      app_token: ${{ steps.encode-token.outputs.encoded_token }}

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.ARM_DEPLOYER_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy Infrastructure
      uses: azure/arm-deploy@v1
      with:
        scope: resourcegroup
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: ${{ secrets.AZURE_RG_CONTOSO }}
        template: ./applications/main.bicep
        failOnStdErr: false

    - name: Generate GitHub App Token
      id: repo-access-app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ secrets.CROSS_REPO_ACCESS_APP_CLIENT_ID }}
        private-key: ${{ secrets.CROSS_REPO_ACCESS_APP_PRIVATE_KEY }}

    - name: Encode Token for Job Output
      id: encode-token
      run: |
        ENCODED=$(echo -n "${{ steps.repo-access-app-token.outputs.token }}" | base64 -w 0)
        echo "encoded_token=$ENCODED" >> $GITHUB_OUTPUT

  trigger-cd-pipelines:
    runs-on: ubuntu-latest
    needs: deploy-container-apps
    strategy:
      fail-fast: false 
      matrix:
        repo:
          - "BpsLogicBuilder/LogicBuilder.Samples.Contoso.Angular"
          - "BpsLogicBuilder/LogicBuilder.Samples.Contoso.ChatHub"
          - "BpsLogicBuilder/LogicBuilder.Samples.Enrollment.KendoGrid.Services"
          - "BpsLogicBuilder/LogicBuilder.Samples.Contoso.Services"
          - "BpsLogicBuilder/LogicBuilder.Samples.Contoso.Spa.Flow"
    steps:
      - name: Decode Token
        id: decode_token
        run: |
          DECODED=$(echo -n "${{ needs.deploy-container-apps.outputs.app_token }}" | base64 -d)
          echo "decoded_access_token=$DECODED" >> $GITHUB_OUTPUT

      - name: Trigger App Deployment
        run: |
          DECODED_TOKEN=$(echo -n "${{ needs.deploy-container-apps.outputs.app_token }}" | base64 -d)
          gh workflow run CD.yml --repo "${{ matrix.repo }}" --ref "master"
        env:
          GH_TOKEN: ${{ steps.decode_token.outputs.decoded_access_token }}