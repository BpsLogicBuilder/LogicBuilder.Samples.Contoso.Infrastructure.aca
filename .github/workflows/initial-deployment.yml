on: [workflow_dispatch]
name: Deploy Initial Infrastructure

jobs:
  deploy-container-apps:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.ARM_DEPLOYER_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy Infrastructure
      uses: azure/arm-deploy@v1
      with:
        scope: resourcegroup
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: ${{ secrets.AZURE_RG_CONTOSO }}
        template: ./applications/main.bicep
        failOnStdErr: false

  trigger-cd-pipelines:
    name: Deploy Services
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: deploy-container-apps
    strategy:
      fail-fast: false 
      matrix:
        repo:
          - "LogicBuilder.Samples.Contoso.Angular"
          - "LogicBuilder.Samples.Contoso.ChatHub"
          - "LogicBuilder.Samples.Enrollment.KendoGrid.Services"
          - "LogicBuilder.Samples.Contoso.Services"
          - "LogicBuilder.Samples.Contoso.Spa.Flow"
    steps:
      - name: Generate GitHub App Token
        id: repo-access-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CROSS_REPO_ACCESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CROSS_REPO_ACCESS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}

      - name: Trigger App Deployment
        run: gh workflow run cd.yml --repo "${{ format('BpsLogicBuilder/{0}', matrix.repo) }}" --ref "master"
        env:
          GH_TOKEN: ${{ steps.repo-access-app-token.outputs.token }}